<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#17283c">
<title>よし太くんの大冒険</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#17283c;color:#fff;font-family:system-ui;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column}
canvas{display:block;background:#17283c}
.controls{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pad{display:flex;gap:14px;align-items:center}
#dpad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:54px 1fr;width:176px;height:146px;border-radius:30px;background:rgba(233,240,255,.88);overflow:hidden;touch-action:none}
#dpad span{display:grid;place-items:center;font-size:30px;color:#17283c;pointer-events:none}
#dpad span:nth-child(-n+2){font-size:22px;background:rgba(23,40,60,.08);border-bottom:2px solid rgba(23,40,60,.15)}
#dpad span:nth-child(odd){border-right:2px solid rgba(23,40,60,.15)}
#dpad span.on{background:#ffdf50}
.btn{width:84px;height:84px;border-radius:50%;border:0;background:rgba(233,240,255,.88);color:#17283c;font:700 14px system-ui;display:grid;place-content:center;line-height:1.15;touch-action:none;padding:0}
.btn b{font-size:28px;display:block}
.btn.on{transform:scale(.92);background:#ffdf50}
#jump{width:100px;height:100px}
.topbtns{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 8px);display:flex;gap:8px;z-index:5}
.topbtns button{width:44px;height:44px;border-radius:12px;border:0;background:rgba(23,40,60,.55);color:#fff;font-size:22px;padding:0;touch-action:none}
#music.off{opacity:.6}
.topbtns #changeBgm{width:auto;min-height:52px;height:auto;padding:6px 14px;background:#ffdf50;color:#17283c;border:2px solid #fff8;box-shadow:0 3px 0 #b58b18,0 4px 12px #0004;font:800 15px system-ui;touch-action:manipulation;line-height:1.3}
#changeBgm small{display:block;font:600 11px system-ui;margin-bottom:2px}
#changeBgm:active{transform:translateY(2px);box-shadow:0 1px 0 #b58b18}
#changeBgm:focus-visible{outline:3px solid #fff;outline-offset:3px}
#startBtn{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:6;font:900 22px system-ui;letter-spacing:2px;padding:9px 28px;border-radius:44px;border:0;background:#ffdf50;color:#20304a;box-shadow:0 6px 0 #c9971e,0 10px 24px #0006;touch-action:manipulation;animation:pulse 1.1s ease-in-out infinite}
#startBtn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #c9971e}
@keyframes pulse{50%{scale:1.07}}
#fs{display:none}
.hint,.help{font-size:13px;opacity:.8;text-align:center;margin:8px 0 0}
.help{display:none}
@media (orientation:landscape){
  /* 左：方向パッド ／ 中央：ゲーム画面 ／ 右：掘る・ジャンプ（重ならない） */
  #stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);align-items:center;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #stage > canvas{grid-column:2;grid-row:1;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain}
  .controls{display:contents}
  .pad{grid-row:1;padding:0 10px}
  .controls .pad:first-child{grid-column:1}
  .controls .pad:last-child{grid-column:3;flex-direction:column-reverse;gap:12px}   /* 上：ジャンプ　下：掘る */
  #dpad{width:min(150px,19vw);height:min(140px,36vh);grid-template-rows:42% 1fr}
  .btn{width:min(80px,10vw,22vh);height:min(80px,10vw,22vh)}
  #jump{width:min(94px,12vw,26vh);height:min(94px,12vw,26vh)}
  .hint{display:none}
  .help{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6px);left:50%;transform:translateX(-50%);margin:0}
}
@media (orientation:portrait){
  #stage > canvas{width:100%;height:auto;aspect-ratio:16/9;margin-top:env(safe-area-inset-top)}
  .controls{flex:1;align-items:center;gap:8px;padding:16px 12px calc(env(safe-area-inset-bottom) + 20px)}
  .pad{gap:10px}
  #dpad{width:min(184px,40vw);height:min(160px,36vw)}
  .topbtns{top:auto;bottom:calc(env(safe-area-inset-bottom) + 12px)}
  #startBtn{top:calc(env(safe-area-inset-top) + 56.25vw*.6 - 22px);font-size:19px;padding:9px 22px}
  .btn{width:min(92px,21vw);height:min(92px,21vw)}#jump{width:min(110px,25vw);height:min(110px,25vw)}
}
@media (hover:hover) and (pointer:fine){.help{display:block}.hint{display:none}}
#arcade{box-sizing:border-box;width:min(560px,94vw);max-height:92dvh;overflow:auto;border:2px solid #79a7cb;border-radius:16px;padding:16px;background:#17283c;color:#fff;text-align:center;touch-action:pan-y}
#arcade::backdrop{background:#071322c9}
#arcade h2,#arcade h3{margin:0 0 8px}
#arcade p{margin:8px 0}
#arcade button{border:0;border-radius:8px;padding:8px 13px;margin:3px;background:#e9f0ff;color:#17283c;font:700 15px system-ui;cursor:pointer;touch-action:manipulation;min-height:36px}
#arcade button:disabled{opacity:.5}
#arcade canvas{display:block;background:#102035;margin:6px auto;max-width:100%;height:auto;object-fit:contain}
#arcade.maze-open{width:min(1120px,97vw);max-height:97dvh;padding:12px}
#arcade.maze-open .arcadeHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
#arcade.maze-open .arcadeHeader h2{margin:0;font-size:clamp(16px,3vw,23px)}
#mazeLayout{display:grid;justify-items:center;align-items:center;gap:8px}
#mazeBoard{width:100%;margin:0!important;image-rendering:pixelated}
#mazeControls{display:grid;justify-items:center;gap:4px}
#mazeDirections{display:grid;grid-template-columns:repeat(3,minmax(32px,50px));grid-template-rows:repeat(3,minmax(32px,50px));gap:3px;touch-action:none}
#arcade #mazeDirections button{margin:0;min-height:0;padding:0;font-size:23px;touch-action:none}
#mazeDirections [data-dir="up"]{grid-area:1/2}
#mazeDirections [data-dir="left"]{grid-area:2/1}
#mazeDirections [data-dir="right"]{grid-area:2/3}
#mazeDirections [data-dir="down"]{grid-area:3/2}
#arcade #mazeDirections button.held{background:#ffdf50}
@media (orientation:landscape){
  #mazeLayout{grid-template-columns:clamp(112px,22vw,174px) minmax(0,1fr)}
  #mazeControls{grid-area:1/1}
  #mazeBoard{grid-area:1/2}
  #mazeBoard{width:min(100%,calc((100dvh - 117px)*1.44))}
}
@media (orientation:portrait){
  #mazeControls{justify-self:start;grid-template-columns:auto auto;align-items:center;gap:3px 14px}
  #mazeDirections{grid-row:1/3;grid-column:1}
  #mazeStatus{grid-column:2}
}
#slotBoard{width:min(330px,100%)}
#slotPayout{margin:8px auto;width:min(310px,100%);color:#ffe384;font:800 18px system-ui}
#slotPayout progress{display:block;width:100%;height:12px;margin-top:5px;accent-color:#ffd74b}
#slotPayoutCount{font-variant-numeric:tabular-nums}
.arcadeStatus{min-height:1.5em;color:#ffdf70}
@media (max-height:450px) and (orientation:landscape){
  #arcade{padding:8px}
  #arcade h2,#arcade h3{font-size:16px;margin:0}
  #arcade p{margin:3px 0}
  #mazeBoard{width:min(100%,calc((100dvh - 88px)*1.44))}
  #mazeDirections{grid-template-columns:repeat(3,minmax(32px,12dvh));grid-template-rows:repeat(3,minmax(32px,12dvh))}
  #arcade button{min-height:30px;padding:4px 10px}
}
</style></head><body>
<div id="stage">
<canvas id="game" width="960" height="540"></canvas>
<p class="hint">📱 横向きにすると大きく遊べます ・ 方向パッドの上段 ↖↗ でジャンプしながら移動</p>
<div class="controls">
  <div class="pad"><div id="dpad"><span>↖</span><span>↗</span><span>◀</span><span>▶</span></div></div>
  <div class="pad"><button class="btn" id="dig"><b>⛏</b>掘る</button><button class="btn" id="jump"><b>⬆</b>ジャンプ</button></div>
</div>
<p class="help">← → / A D 移動・スペースでジャンプ（移動キーと同時押しで斜めジャンプ）・X で穴掘り・M で音楽ON/OFF・R でやり直し</p>
<button id="startBtn">▶ START</button>
<div class="topbtns"><button id="changeBgm" aria-label="BGM変更。現在：ファミコン風。アレンジ曲に切り替える" aria-pressed="false"><small>現在：ファミコン風</small>♫ BGM変更</button><button id="music" aria-label="音楽">🎵</button><button id="fs" aria-label="全画面">⛶</button></div>
</div>
<dialog id="arcade" aria-labelledby="arcadeTitle">
  <div class="arcadeHeader">
    <h2 id="arcadeTitle">はしごの先のあそび場</h2>
    <button id="arcadeExit" type="button">地上へ戻る</button>
  </div>
  <section id="mazePanel" hidden>
    <div id="mazeLayout">
      <canvas id="mazeBoard" width="416" height="288" aria-label="迷路"></canvas>
      <div id="mazeControls">
        <div id="mazeDirections" aria-label="方向ボタン">
          <button type="button" data-dir="up" aria-label="上">↑</button>
          <button type="button" data-dir="left" aria-label="左">←</button>
          <button type="button" data-dir="right" aria-label="右">→</button>
          <button type="button" data-dir="down" aria-label="下">↓</button>
        </div>
        <p id="mazeStatus" class="arcadeStatus" role="status"></p>
      </div>
    </div>
  </section>
  <section id="slotsPanel" hidden>
    <h3>よし太くんスロット</h3>
    <p>1等 よし太くん3つ 50枚 ／ 2等 ほかの絵柄3つ 25枚<br>3等 よし太くん2つ 10枚 ／ 4等 ほかの絵柄2つ 5枚</p>
    <canvas id="slotBoard" width="330" height="104" aria-label="スロットの絵柄"></canvas>
    <button id="slotSpin" type="button">まわす</button>
    <p id="slotStatus" class="arcadeStatus" role="status"></p>
    <div id="slotPayout" hidden aria-hidden="true">
      <span id="slotPayoutCount"></span>
      <progress id="slotPayoutMeter" value="0" max="1"></progress>
    </div>
  </section>
</dialog>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),W=960,H=540,ground=465;
let world=4300,stage=1,AX=0,arenaOn=false,boss=null,rocks=[],waves=[],parts=[],shake=0,bannerText='',bannerSub='',bannerT=0,clearT=0,endT=0,stageStartScore=0;
let keys={},player,coins=[],enemies=[],platforms=[],camera=0,score=0,state='play',goalTick=0,audioCtx,deathTick=0,lives=3,holes=[],digCooldown=0,digHold=false,padJump=false,bgmStep=0,curSong=null,digBuf=0,digBufT=0,failMark=null,items=[],popups=[],spots=[];
const STARS=Array.from({length:90},(_,i)=>({x:(i*397)%W,y:(i*173)%380,s:1+(i%3),p:i}));
const CREDITS=['モグラ大王 ドリモグを たおした！','','谷に 光が もどり','空の国に 平和が おとずれた','','','— よし太くんの大冒険 —','','STAGE 1　そよかぜの丘','STAGE 2　大王の谷','','','HERO　よし太くん','','','THANK YOU FOR PLAYING!'];
const CREDITS_PAIR=['モグラ大王 ドリモグを たおした！','','とらわれていた ソラ姫を 助けだし','ふたりは 空の国で 結ばれた','','','— よし太くんの大冒険 —','','STAGE 1　そよかぜの丘','STAGE 2　大王の谷','','','HERO　よし太くん','PRINCESS　ソラ姫','','','おしあわせに！','','THANK YOU FOR PLAYING!'];
let endingPair=false;   // true：お姫様と2人のエンディング（50%の確率）
// レアエンディング（10%）：ドリモグが心を入れかえて友だちに
const CREDITS_RARE=['モグラ大王 ドリモグを たおした！','','……と 思ったら','ドリモグは 心を入れかえ','みんなの 友だちになった！','','ソラ姫も いっしょに','空の国で 大パーティー！','','','★ RARE ENDING ★','','— よし太くんの大冒険 —','','HERO　よし太くん','PRINCESS　ソラ姫','FRIEND　ドリモグ','','','これを見られたあなたは','とってもラッキー！','','THANK YOU FOR PLAYING!'];
let endingRare=false;
function credits(){return endingRare?CREDITS_RARE:endingPair?CREDITS_PAIR:CREDITS}

// ===== ステージ =====
function newPlayer(inv){return {x:60,y:300,w:34,h:42,vx:0,vy:0,on:false,inv:inv,facing:1,hole:null}}
// perch を渡すと空の踏み台の上から始まり、しばらく踏み台を往復してから地面へ降りる
function makeEnemy(x0,type,i,perch){return {x:x0,y:perch?perch.y-32:ground-32,w:32,h:32,alive:true,dir:i%2?1:-1,vy:0,spawnX:x0,respawns:0,type,speed:type==='hop'?1.3:type==='boar'?.9:.7,hopT:40+i*7,grounded:true,home:perch?null:x0,range:240,perchT:perch?240+Math.floor(Math.random()*240):0}}
function boarSpeed(e,p){
  if(!e.grounded||e.kick>0){
    e.windup=0;e.charge=0;
    return e.speed;
  }
  if(e.windup||e.charge){
    e.dir=e.chargeDir;
    if(!onSurface(e.x+(e.dir>0?e.w+8:-8),e.y+e.h)){
      e.windup=0;e.charge=0;e.recover=45;
      return 0;
    }
    if(e.windup){
      if(--e.windup===0)e.charge=60;
      return 0;
    }
    if(--e.charge===0)e.recover=55;
    return 5.8;
  }
  if(e.recover>0){
    e.recover--;
    return e.speed;
  }
  if(e.chasing&&Math.abs(p.x+p.w/2-e.x-e.w/2)<=245){
    e.windup=34;e.chargeDir=e.dir;
    return 0;
  }
  return e.speed*(e.chasing?1.45:1);
}
function onSurface(px,y){return platforms.some(b=>Math.abs(b.y-y)<2&&px>=b.x&&px<=b.x+b.w)}
function groundAt(px){return platforms.some(b=>b.y===ground&&px>=b.x&&px<=b.x+b.w)}
function addPerchEnemies(idx){const floats=platforms.filter(b=>b.y<ground-1&&(stage!==2||b.x+b.w<AX));idx.forEach((k,i)=>{const f=floats[k];if(f)enemies.push(makeEnemy(f.x+f.w/2-16,i%2===1?'hop':'walk',i+20,f))})}
function banner(t,s,d=150){bannerText=t;bannerSub=s;bannerT=d}
const COINS_PER_LIFE=100,COIN_POINTS=10;
const STAGE2_OFFSET=240,STAGE2_START=STAGE2_OFFSET+60,STAGE2_BONUS_X=38;
function stageStartX(){return stage===2?STAGE2_START:60;}
function followCamera(px){
  if(arenaOn)return AX;
  const anchor=stage===2&&!inBasement?120:240;
  return Math.max(0,Math.min(world-W,px-anchor));
}
const VAULT_DIAMONDS=3,VAULT_X=STAGE2_OFFSET+2300;
let coinProgress=0,stageStartCoinProgress=0,diamonds=0,stageStartDiamonds=0;
let diamondVaultUsed=false,bonusLoot=null,bonusResult=null;
function loadStage(n){
  victoryFlight=null;
  stopStageClearAudio();
  stopBossSounds();
  stage=n;stageStartScore=score;stageStartCoinProgress=coinProgress;stageStartDiamonds=diamonds;diamondVaultUsed=false;bonusLoot=null;bonusResult=null;try{if(n===1)mp3Restart('field1')}catch(_){}balls=[];cannonWarn=null;cannonT=60*8;lastSafeX=stageStartX();bonusUsed[n]=false;rainGapCrossed=false;roomKind='basement';roomT=0;inBasement=false;surface=null;secret={x:n===1?2520:STAGE2_OFFSET+840,used:false};items=[];popups=[];spots=[];holes=[];digCooldown=0;deathTick=0;goalTick=0;camera=0;coins=[];enemies=[];platforms=[];rocks=[];waves=[];parts=[];boss=null;arenaOn=false;shake=0;
  if(n===1){
    world=4300;
    for(let i=0;i<world/240;i++){if(i!==5&&i!==11&&i!==15)platforms.push({x:i*240,y:ground,w:240,h:75});}
    for(let i=0;i<13;i++)platforms.push({x:320+i*285,y:325-(i%3)*40,w:115,h:18});
    for(let i=0;i<30;i++)coins.push({x:180+i*130,y:260+(i%4)*34,taken:false});
    for(let i=0;i<11;i++)enemies.push(makeEnemy(450+i*330,i%3===2?'hop':'walk',i));
    addPerchEnemies([1,4,7,10]);
    [[2,'gem'],[4,'coins'],[7,'heart'],[9,'gem'],[13,'chest'],[16,'gem']].forEach(([k,t])=>spots.push({x:k*240+120,type:t,found:false}));
    banner('STAGE 1','そよかぜの丘');
  }else{
    AX=STAGE2_OFFSET+3840;world=AX+960;
    platforms.push({x:0,y:ground,w:STAGE2_OFFSET,h:75});
    for(let i=0;i<16;i++){
      if(i!==4&&i!==8)platforms.push({x:STAGE2_OFFSET+i*240,y:ground,w:240,h:75});
    }
    platforms.push({x:AX,y:ground,w:960,h:75});
    // ボス手前は頭上の足場を置かず、イノシシが走り回れる地上区間にする。
    const boarLaneStart=STAGE2_OFFSET+2330;
    for(let i=0;i<8;i++)platforms.push({x:STAGE2_OFFSET+330+i*270,y:330-(i%3)*45,w:110,h:18});
    platforms.push({x:AX+170,y:320,w:110,h:18},{x:AX+680,y:320,w:110,h:18});
    for(let i=0;i<30;i++){
      const cx=STAGE2_OFFSET+200+i*120;
      coins.push({x:cx,y:cx>=boarLaneStart?ground-30:270+(i%4)*30,taken:false});
    }
    [520,760,1320,1500,1700,1850,2250,2450,2730,3100,3510].forEach((ex,i)=>enemies.push(makeEnemy(STAGE2_OFFSET+ex,i===2||i===6||i>=8?'boar':i%2===1?'hop':'walk',i)));
    addPerchEnemies([1,3,6]);
    [[2,'gem'],[5,'heart'],[7,'coins'],[9,'chest'],[12,'gem']].forEach(([k,t])=>spots.push({x:STAGE2_OFFSET+k*240+120,type:t,found:false}));
    banner('STAGE 2','大王の谷');
  }
  player=newPlayer(120);player.x=stageStartX();camera=followCamera(player.x);state='play';resetTimer();timeBonus=0;   // スタート直後は2秒無敵
}
function reset(){score=0;coinProgress=0;diamonds=0;lives=3;keys={};bonusUsed={};loadStage(1)}
function retry(){if(stage===2){score=stageStartScore;coinProgress=stageStartCoinProgress;diamonds=stageStartDiamonds;lives=3;keys={};loadStage(2)}else reset()}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function trappedIn(h){return enemies.some(e=>e.alive&&e.trapHole===h)||(boss&&boss.hole===h)}
function inHole(h){return enemies.filter(e=>e.alive&&e.trapHole===h)}

// ===== 連鎖ボーナス：1つの穴にまとめて埋めるほど高得点（1匹100／2匹400／3匹900／4匹1600） =====
const HOLE_MAX=4,HOLE_T=600;   // 穴が開いている時間（約10秒）
function popup(x0,y0,text,col='#fff',size=24,t=80){popups.push({x:x0,y:y0,text,col,size,t,max:t})}
function buryHole(h){const list=inHole(h),n=list.length;if(!n)return;list.forEach(e=>e.alive=false);const pts=100*n*n;score+=pts;
  if(n>1){popup(h.x+h.w/2,ground-70,n+'匹まとめて！ ×'+n,'#ffdf50',30,100);popup(h.x+h.w/2,ground-38,'+'+pts,'#fff',26,100);sound('chain');boom(h.x+h.w/2,ground,10*n,['#ffdf50','#fff','#ff9a3c']);shake=Math.max(shake,4+n*2)}
  else{popup(h.x+h.w/2,ground-40,'+'+pts,'#fff',22);sound('bury')}}

// ===== 宝物：キラキラ光る地面を掘ると出てくる =====
const ITEM_INFO={coin:{pts:10},gem:{pts:300},chest:{pts:1000},heart:{pts:0}};
function spawnItem(type,x0){items.push({type,x:x0,y:ground-14,vx:(Math.random()<.5?-1:1)*(1.5+Math.random()*2),vy:-9-Math.random()*2.5,t:720})}
function revealTreasure(h){
  const sp=spots.find(s=>!s.found&&s.x>=h.x-6&&s.x<=h.x+h.w+6);

function mp3Key(song){if(!mp3Enabled)return null;const key=song==='field'&&stage===1?'field1':song;return MP3_BGM[key]?.src?key:null}
function mp3Get(key){if(key in mp3)return mp3[key];const cfg=MP3_BGM[key];if(!cfg)return mp3[key]=null;
  const m=mp3[key]={cfg,el:null,elBad:false,buf:null,bufBad:false,loading:false,engine:mp3UseWebAudio?'buf':'el',src:null,gain:null,pos:0,lastCtxT:0,reqT:0,elT0:0,elOK:false};

function bgmTick(){

    const upcoming=state==='clear'?'field2':bossIntroLong()?'boss':null;

  }
  const playingArrangement=mp3Tick();
  const waitForArrangement=mp3Enabled&&(s==='field2'||s==='boss'||state==='ending');
  if(playingArrangement||waitForArrangement){curSong=s;bgmNext=0;return}
  if(!audioCtx||audioCtx.state!=='running')return;
  if(paused){bgmNext=0;return}
  if(s!==curSong){curSong=s;bgmStep=0;bgmNext=0}
  if(!s||!musicOn||document.hidden){bgmNext=0;return}
  const song=SONGS[s],now=audioCtx.currentTime;

// ボス戦では穴が大きくなる（幅100・深さ60）
// 掘れる場所を探す：掘りかけの穴があればそれを続ける。崖の端や隣の穴にかかる時は少しずらして掘れる場所を探す
function digSpot(){if(bossIntroLong())return null;if(inBasement)return null;
  const p=player;if(state!=='play'||!p.on||p.hole||Math.abs(p.y+p.h-ground)>=12)return null;
  const hw=arenaOn?100:48,hd=arenaOn?60:48,dir=p.facing===-1?-1:1,pc=p.x+p.w/2,center=pc+dir*(hw/2+28);
  const cur=holes.find(h=>h.stage<3&&Math.abs(h.x+h.w/2-center)<h.w/2+8&&(dir>0?(h.x+h.w>p.x+p.w-4&&h.x<p.x+p.w+110):(h.x<p.x+4&&h.x+h.w>p.x-110)));   /* 向いている側の穴だけ続きを掘る（左右対称） */if(cur)return {hole:cur};
  // 敵が入っている穴の前なら「埋める」
  const occ=holes.find(h=>h.stage===3&&Math.abs(h.x+h.w/2-center)<h.w/2+12&&inHole(h).length>0);if(occ)return {bury:occ};
  for(const off of[0,-8,-16,-22,8,16,24]){const c=center+dir*off;
    if(Math.abs(c-pc)<hw/2+6)continue;   // 足元に掘らない
    // 穴の範囲がすべて地面の上にあるか（地面の継ぎ目をまたいでもOK、崖にかかるのはNG）
    let ok=true;for(let sx=c-hw/2+.5;sx<=c+hw/2-.5;sx+=8)if(!groundAt(sx)){ok=false;break}if(!ok||!groundAt(c+hw/2-.5))continue;
    if(holes.some(e=>Math.abs(e.x+e.w/2-c)<(e.w+hw)/2+1))continue;
    return {x:c-hw/2,w:hw,h:hd};}
  return null}

  if(s.bury){buryHole(s.bury);holes=holes.filter(h=>h!==s.bury);digCooldown=15;sound('dig');return true}
  let h=s.hole;if(!h){h={x:s.x,y:ground,w:s.w,h:s.h,t:HOLE_T,stage:0};holes.push(h);}h.stage++;h.t=HOLE_T;digCooldown=9;sound('dig');if(h.stage===3){revealTreasure(h);checkSecret(h);}return true}

function resetMaze(){
  stopMazeHold();

  MAZE.forEach((row,y)=>Array.from(row).forEach((cell,x)=>{

  }));
  maze={hero:MAZE_START,foes:MAZE_ENEMY_STARTS.slice(),stars,points:0,turn:0,facing:1,result:null,foeMotion:[null,null]};

function mazeWalk(pos,move){
  const next=[pos[0]+move[0],pos[1]+move[1]];
  return MAZE[next[1]]?.[next[0]]==='.'?next:null;
}
function mazeEnemyStep(from,target){
  const seen=new Set([from.join(',')]),queue=[[from,null]];
  for(let i=0;i<queue.length;i++){
    const [pos,first]=queue[i];
    if(pos[0]===target[0]&&pos[1]===target[1])return first||from;
    for(const move of Object.values(MAZE_MOVES)){
      const next=mazeWalk(pos,move);
      if(!next||seen.has(next.join(',')))continue;
      seen.add(next.join(','));queue.push([next,first||next]);
    }
  }
  return from;
}
const MAZE_GLIDE_FRAMES=8;
function mazeVisualPosition(target,motion){
  if(!motion)return target;
  const progress=motion.frame/motion.duration;
  return target.map((value,i)=>motion.from[i]+(value-motion.from[i])*progress);
}
function advanceMazeMotion(motion){
  if(!motion||++motion.frame>=motion.duration)return null;
  return motion;
}
function updateMazeMotion(){
  if(!maze.motion&&!maze.foeMotion.some(Boolean))return;
  maze.motion=advanceMazeMotion(maze.motion);
  maze.foeMotion=maze.foeMotion.map(advanceMazeMotion);
  drawMaze();
}
function mazeMove(dir){
  if(arcadeGame!=='maze'||maze.result)return;
  const next=mazeWalk(maze.hero,MAZE_MOVES[dir]);
  if(!next)return;
  const fromHero=mazeVisualPosition(maze.hero,maze.motion);
  maze.hero=next;
  if(dir==='left'||dir==='right')maze.facing=dir==='left'?-1:1;
  const hit=()=>maze.foes.some(foe=>foe[0]===next[0]&&foe[1]===next[1]);
  let collided=hit();
  if(!collided){
    maze.turn++;
    maze.foes=maze.foes.map((foe,i)=>{
      if(maze.turn%(i===0?3:4)!==0)return foe;
      const target=mazeEnemyStep(foe,next);
      if(target!==foe){
        maze.foeMotion[i]={from:mazeVisualPosition(foe,maze.foeMotion[i]),frame:0,duration:i===0?22:29};
      }
      return target;
    });
    collided=hit();
  }
  if(collided){
    maze.motion=null;maze.foeMotion=[null,null];
    maze.result='ミス！';stopMazeHold();arcadeReturnFrames=105;sound('hurt');
  }else{
    maze.motion={from:fromHero,frame:0,duration:MAZE_GLIDE_FRAMES};
    if(maze.stars.delete(next.join(','))){maze.points+=MAZE_STAR_POINTS;sound('coin');}

}

    // 近くにプレイヤーがいたら寄ってくる（崖の向こうへは行かない）。プレイヤーが穴の中にいる時は追わない
    const dx=p.x+p.w/2-(e.x+e.w/2);
    e.chasing=!perched&&!p.hole&&Math.abs(dx)<420&&Math.abs(dx)>4&&p.y+p.h>=ground-90&&onSurface(aheadOf(Math.sign(dx)),surfY);
    if(e.chasing){e.dir=Math.sign(dx);e.home=e.x;}
    else if((!perched||e.perchT>0)&&!onSurface(aheadOf(e.dir),surfY))e.dir*=-1;
    else if(!perched&&Math.abs(e.x-e.home)>e.range&&Math.sign(e.x-e.home)===e.dir)e.dir*=-1;}
  else e.chasing=false;
  if(e.type==='hop'&&e.grounded&&!(perched&&e.perchT>0)&&--e.hopT<=0){e.vy=-10.5;e.grounded=false;e.hopT=55+Math.floor(Math.random()*50);}
  if(e.safe>0)e.safe--;
  const speed=e.type==='boar'?boarSpeed(e,p):e.speed*(e.chasing?1.45:1);
  e.x+=e.dir*(e.kick>0?3.2:speed);if(e.kick>0)e.kick--;
  if(e.x<0||e.x>world-e.w){e.dir*=-1;e.x=Math.max(0,Math.min(world-e.w,e.x));}
  const ecx=e.x+e.w/2;
  const trap=e.vy>=0?holes.find(h=>h.stage===3&&ecx>h.x+3&&ecx<h.x+h.w-3&&e.y+e.h>=ground-12&&e.y+e.h<=ground+18&&!(boss&&boss.hole===h)&&inHole(h).length<HOLE_MAX):null;
  if(trap){e.trapHole=trap;e.x=trap.x+(trap.w-e.w)/2;e.y=ground+3;e.vy=0;sound('stomp');{const n=inHole(trap).length;if(n>1){popup(trap.x+trap.w/2,ground-90,n+'匹目！','#ffdf50',26,60);tone(523+n*130,.12,'square',.07)}trap.t=Math.max(trap.t,150);}if(p.hole===trap&&p.inv<=0)die('穴に敵が落ちてきた！');continue;}
  const foot=e.y+e.h;
  const support=e.vy>=0?platforms.find(b=>e.x+e.w>b.x&&e.x<b.x+b.w&&foot<=b.y+12&&foot>=b.y-18):null;
  if(support){e.y=support.y-e.h;e.vy=0;e.grounded=true;}else{e.grounded=false;e.vy=Math.min(14,e.vy+.65);e.y+=e.vy;}
  // 崖に落ちた敵は、近くの空の踏み台に降ってきて再登場
  if(e.y>H+100){const floats=platforms.filter(b=>b.y<ground-1&&(stage!==2||b.x+b.w<AX));
    const pl=floats.reduce((best,b)=>!best||Math.abs(b.x+b.w/2-e.spawnX)<Math.abs(best.x+best.w/2-e.spawnX)?b:best,null);
    e.x=pl.x+pl.w/2-e.w/2;e.y=pl.y-e.h-140;e.vy=0;e.respawns++;e.grounded=false;e.dir=e.respawns%2?1:-1;e.home=null;e.perchT=240+Math.floor(Math.random()*180);continue;}
  if(rect(p,e)){if(oldY+p.h<=e.y+14&&p.vy>0){e.alive=false;p.vy=-9;score+=e.type==='boar'?100:e.type==='hop'?80:50;sound('stomp');}
    // 上から降ってきた敵が頭に当たっても、ミスにせず跳ね返す
    else if(e.vy>1&&e.y+e.h-e.vy<=p.y+12){e.vy=-7;e.dir=(e.x+16<p.x+p.w/2)?-1:1;e.kick=30;e.safe=50;e.grounded=false;sound('bounce');popup(e.x+16,e.y-6,'ポン！','#fff',18,40);}
    else if(p.inv<=0&&!(e.safe>0)&&rect(hitBox(p),e)){die('敵にぶつかった！');}}
}

}

  const wave=Math.sin(t*.2)*10;ell(42,40-wave,12,9,'#f2a7a0');ell(-44,56,11,9,'#f2a7a0');   // 手をふる
  x.fillStyle='#c0c8d8';x.beginPath();x.moveTo(-28,30);x.lineTo(-60,38);x.lineTo(-28,46);x.closePath();x.fill();
  x.strokeStyle='#2a1810';x.lineWidth=3;x.beginPath();x.arc(-6,30,5,Math.PI*1.1,Math.PI*1.9);x.moveTo(-17,30);x.arc(-22,30,5,Math.PI*1.1,Math.PI*1.9);x.stroke();  // にっこり目
  x.beginPath();x.arc(-12,44,9,.2*Math.PI,.8*Math.PI);x.stroke();ell(-30,40,5,3,'#ff9bb0');ell(6,40,5,3,'#ff9bb0');
  x.restore();drawCrown(cx-4*s,y+12*s,1.1*s);}
function drawRainbow(){const cols=['#ff5a5a','#ffa43c','#ffe14d','#6fdc6f','#4fc3ff','#7a7aff','#c86bff'];x.globalAlpha=.55;cols.forEach((c,i)=>{x.strokeStyle=c;x.lineWidth=12;x.beginPath();x.arc(W/2,ground+60,330-i*12,Math.PI,0);x.stroke();});x.globalAlpha=1}
function drawEnding(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1030');g.addColorStop(1,'#3a2a5a');x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const s of STARS){x.globalAlpha=.35+.65*Math.abs(Math.sin(endT*.03+s.p));x.fillStyle='#fff';x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;
  drawParts();
  x.fillStyle='#2d5a3a';x.fillRect(0,ground,W,H-ground);x.fillStyle='#3f7a4f';x.fillRect(0,ground,W,10);
  if(endingDone())drawQuestDoor();
  const princess=endingPrincessPosition();
  if(endingRare){drawRainbow();const jump=k=>Math.abs(Math.sin(endT*.13+k))*18;
    drawEndPlayer();
    drawPartner(princess.x,princess.y,endP&&endP.x<princess.x?-1:1);
    drawMoleFriend(W/2+90,ground-88*.75-jump(2),.75,endT);
    x.textAlign='center';const on=Math.floor(endT/20)%2;x.font='900 30px system-ui';x.lineWidth=6;x.strokeStyle='#7a4a00';x.fillStyle=on?'#ffe14d':'#fff6a8';x.strokeText('★ RARE ENDING ★',W/2,48);x.fillText('★ RARE ENDING ★',W/2,48);x.textAlign='left';
  }else if(endingPair){
    // 花のアーチ
    x.strokeStyle='#fff8';x.lineWidth=6;x.beginPath();x.arc(W/2,ground,120,Math.PI,0);x.stroke();for(let k=0;k<=12;k++){const a=Math.PI+k*Math.PI/12;x.fillStyle=['#ff9ad5','#fff','#ffd84d'][k%3];x.beginPath();x.arc(W/2+Math.cos(a)*120,ground+Math.sin(a)*120,6,0,7);x.fill();}
    drawEndPlayer();drawPartner(princess.x,princess.y,endP&&endP.x>princess.x?1:-1);
  }else{drawEndPlayer();}
  drawParts(true);
  x.textAlign='center';x.fillStyle='#fff';x.shadowColor='#000';x.shadowBlur=6;
  const sy=creditsY();
  credits().forEach((l,i)=>{const y=sy+i*46;if(y>-40&&y<ground-60){x.font=(i===0||l.startsWith('—'))?'bold 34px system-ui':'26px system-ui';x.fillText(l,W/2,y)}});
  if(endingDone()){x.font='bold 64px system-ui';x.fillStyle='#ffdf50';x.fillText('THE END',W/2,190);x.fillStyle='#fff';x.font='bold 28px system-ui';x.fillText('FINAL SCORE  '+score,W/2,245);x.font='22px system-ui';if(Math.floor(endT/30)%2)x.fillText('タップで もういちど あそぶ',W/2,300);}
  x.shadowBlur=0;x.textAlign='left';
}

// 固定60fps：120Hz画面のスマホでも速くならない
// ===== 一時停止（ゲーム中に画面をタップ） =====
let paused=false;
function canPause(){return mode==='game'&&state==='play'}
function clearInput(){keys.left=keys.right=keys.jump=false;padJump=false;digHold=false;digBuf=0;document.querySelectorAll('.on').forEach(el=>el.classList.remove('on'))}
function setPause(on){if(on&&!canPause())return;if(paused===on)return;paused=on;clearInput();if(on)tone(520,.08,'square',.05);else tone(780,.08,'square',.05);}
function drawPause(){x.fillStyle='#0009';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='900 72px system-ui';x.fillText('PAUSE',W/2,250);
  x.font='bold 24px system-ui';x.fillText('画面をタップで さいかい',W/2,305);x.font='18px system-ui';x.fillStyle='#cfd8ea';x.fillText('SCORE '+score+'　　♥ × '+lives,W/2,350);x.textAlign='left';}
const STEP=1000/60;let last=0,acc=0;
function loop(t){if(!last)last=t;acc+=Math.min(100,t-last)*(mode==='title'?.85:1);last=t;if(paused)acc=0;while(acc>=STEP){update();acc-=STEP;}mp3LoopCheck();draw();if(mode==='title')drawTitle();if(paused)drawPause();requestAnimationFrame(loop)}
if(!restoreQuestEnding())toTitle();
requestAnimationFrame(loop);

// キーボード
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(mode==='title'){if(k==='enter'||k===' '){e.preventDefault();startGame();}if(k==='m'&&!e.repeat){unlockAudio();setMusic(!musicOn);}return}if(k==='p'||k==='escape'){if(!e.repeat)setPause(!paused);return}if(paused)return;if(['arrowleft','a','arrowright','d',' ','arrowup','w'].includes(k))unlockAudio();if(['arrowleft','a'].includes(k))keys.left=true;if(['arrowright','d'].includes(k))keys.right=true;if([' ','arrowup','w'].includes(k)){keys.jump=true;e.preventDefault()}if(k==='x'){unlockAudio();if(!e.repeat)dig();}if(k==='m'&&!e.repeat){unlockAudio();setMusic(!musicOn);}if(k==='r'){if(state==='lose')retry();else reset()}});
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if([' ','arrowup','w'].includes(k))keys.jump=false});

// 方向パッド：下段で移動、上段（↖↗）でジャンプしながら移動。指を離さずスライドで切り替え
const dpad=document.getElementById('dpad'),[dul,dur,dl,dr]=dpad.children;let dpadId=null;
function dpadSet(e){const r=dpad.getBoundingClientRect(),right=e.clientX>r.left+r.width/2,up=e.clientY<dul.getBoundingClientRect().bottom;keys.left=!right;keys.right=right;padJump=up;dl.classList.toggle('on',!right&&!up);dr.classList.toggle('on',right&&!up);dul.classList.toggle('on',!right&&up);dur.classList.toggle('on',right&&up)}
function dpadEnd(e){if(e.pointerId!==dpadId)return;dpadId=null;keys.left=keys.right=false;padJump=false;for(const s of dpad.children)s.classList.remove('on')}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title')return;unlockAudio();dpadId=e.pointerId;try{dpad.setPointerCapture(e.pointerId)}catch(_){}dpadSet(e)});
dpad.addEventListener('pointermove',e=>{if(e.pointerId===dpadId)dpadSet(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpad.addEventListener(ev,dpadEnd));

// ボタン（マルチタッチ対応）
function holdButton(el,down,up){let id=null;el.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='title')return;unlockAudio();id=e.pointerId;try{el.setPointerCapture(id)}catch(_){}el.classList.add('on');down()});const end=e=>{if(e.pointerId!==id)return;id=null;el.classList.remove('on');up()};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,end))}
holdButton(document.getElementById('jump'),()=>keys.jump=true,()=>keys.jump=false);
holdButton(document.getElementById('dig'),()=>{dig();},()=>{}); // 1タップにつき1回だけ掘る。デモAIの自動掘削は維持

c.addEventListener('pointerdown',()=>{if(mode==='title')return;unlockAudio();if(paused){setPause(false);return}if(state==='lose')retry();else if(state==='ending'&&endingDone()&&!endP?.doorFrame)toTitle();else if(canPause())setPause(true);});

// スクロール・ズーム・長押しメニューを防止
document.addEventListener('touchmove',e=>{if(!arcade.open)e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// アプリ切替時に入力をリセット
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true);try{if(!document.hidden)unlockAudio()}catch(_){}keys.left=keys.right=keys.jump=false;padJump=false;digHold=false;last=0;acc=0;document.querySelectorAll('.on').forEach(el=>el.classList.remove('on'))});

// スタートボタン（click で開始：iPhoneの音もこの操作で鳴らせる）
document.getElementById('startBtn').addEventListener('click',e=>{e.stopPropagation();startGame()});

// 音楽ON/OFFボタン（設定は次回も保持）
const mb=document.getElementById('music');
function setMusic(on){musicOn=on;mb.textContent=on?'🎵':'🔇';mb.classList.toggle('off',!on);try{localStorage.setItem('skyhop-music',on?'on':'off')}catch(_){}if(bgmBus&&audioCtx)bgmBus.gain.setTargetAtTime(on?1:0,audioCtx.currentTime,.02)}
mb.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setMusic(!musicOn)});
setMusic(musicOn);

// あらかじめ用意したMP3とオリジナルBGMを切り替える。
const changeBgm=document.getElementById('changeBgm');
function updateBgmButton(){
  const current=mp3Enabled?'アレンジ曲':'ファミコン風',next=mp3Enabled?'ファミコン風':'アレンジ曲';
  changeBgm.replaceChildren();
  const status=document.createElement('small');status.textContent='現在：'+current;
  changeBgm.append(status,document.createTextNode('♫ BGM変更'));
  changeBgm.setAttribute('aria-label','BGM変更。現在：'+current+'。'+next+'に切り替える');
  changeBgm.title=next+'に切り替える';
  changeBgm.setAttribute('aria-pressed',String(mp3Enabled));
}
changeBgm.addEventListener('click',e=>{
  e.stopPropagation();unlockAudio();
  if(mp3Cur){mp3Halt(mp3Cur);mp3Cur=null}
  mp3Enabled=!mp3Enabled;
  curSong=null;bgmNext=0;bgmStep=0;
  if(mp3Enabled){
    setMusic(true);
    // 再生要求とAudioContextの復帰をクリック処理内で行い、iOSの操作制限に対応。
    unlockAudio();
    const key=mp3Key(currentSong());
    if(key&&!paused&&mode==='game'&&!document.hidden){
      const m=mp3Get(key);mp3Load(m);mp3Cur=key;m.started=true;
      if(m.engine==='el')mp3PlayEl(m);
    }
  }
  updateBgmButton();bgmTick();
});
updateBgmButton();

// 全画面ボタン（対応端末のみ：主にAndroid）
const fs=document.getElementById('fs'),root=document.documentElement;
if(root.requestFullscreen&&document.fullscreenEnabled){fs.style.display='block';fs.addEventListener('click',async()=>{try{await root.requestFullscreen();await screen.orientation?.lock?.('landscape')}catch(_){}});document.addEventListener('fullscreenchange',()=>fs.style.display=document.fullscreenElement?'none':'block')}
</script></body></html>
